media:
  input: public/media
  output: /media
  rename: safe
  categories: [image]
content:
  - name: site
    label: Homepage & company settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: brand
        label: Website brand
        type: string
        required: true
      - name: heroEyebrow
        label: Hero small heading
        type: string
      - name: heroTitle
        label: Main homepage headline
        type: string
        required: true
      - name: heroDescription
        label: Homepage introduction
        type: text
      - name: heroImage
        label: Homepage background image (optional)
        type: image
      - name: manufacturingImage
        label: Factory photo - Engineering & Manufacturing section
        type: image
      - name: homeSectionTitle
        label: Homepage section heading
        type: string
      - name: homeSectionDescription
        label: Homepage section description
        type: text
      - name: clientsHeading
        label: Customer logo section title
        type: string
      - name: clientsDescription
        label: Customer logo section introduction
        type: text
      - name: clientsMore
        label: Show View more link (only after project pages are published)
        type: boolean
      - name: email
        label: Company public inquiry email
        type: string
      - name: phone
        label: Company public phone
        type: string
      - name: company
        label: Legal company name
        type: string
      - name: location
        label: Company location
        type: string
      - name: since
        label: Founded year
        type: string
      - name: legalNotice
        label: Scope disclaimer
        type: text
      - name: seoTitle
        label: Homepage Google title
        type: string
      - name: seoDescription
        label: Homepage Google description
        type: text
  - name: about
    label: About Page Photos
    type: file
    path: content/about.json
    format: json
    fields:
      - name: overviewImage
        label: 01 - Company Overview Main Photo
        type: image
        description: Main About photo. Recommended landscape 16:9 composition.
      - name: companyEnvironmentImage
        label: 02 - Company Office / Reception Photo
        type: image
        description: Optional supporting photo for the Company at a Glance section. Recommended landscape 16:9.
      - name: manufacturingGallery
        label: 03 - Manufacturing Gallery (up to 4 photos)
        type: image
        description: Factory exterior, aerial view and workshop photos. Recommended landscape 3:2 images.
        options:
          multiple:
            max: 4
          unique: true
      - name: engineeringGallery
        label: 04 - Engineering & Equipment Gallery (up to 3 photos)
        type: image
        description: Pressure vessels and fabricated equipment. Recommended landscape 3:2 images.
        options:
          multiple:
            max: 3
          unique: true
      - name: internationalImage
        label: 05 - International Business / Shipment Photo
        type: image
        description: Export packing, loading or delivery photo. Recommended landscape 16:9.
      - name: innovationGallery
        label: 06 - Innovation & University Cooperation (up to 2 photos)
        type: image
        description: Genuine research, university cooperation or technical development photos. Recommended landscape 3:2 images.
        options:
          multiple:
            max: 2
          unique: true
  - name: clients
    label: Customer logos
    type: collection
    path: content/clients
    format: json
    filename: '{primary}.json'
    view:
      primary: name
    fields:
      - name: name
        label: Customer name
        type: string
        required: true
      - name: logo
        label: Logo image (PNG, WebP or SVG)
        type: image
      - name: order
        label: Display order (1, 2, 3...)
        type: number
  - name: solutions
    label: Process solutions
    type: collection
    path: content/solutions
    format: json
    filename: '{primary}.json'
    view:
      primary: title
    fields:
      - name: title
        label: Solution name
        type: string
        required: true
      - name: category
        type: string
      - name: summary
        type: text
      - name: catalogUrl
        label: Related products URL on tyceqt.com (optional)
        type: string
      - name: catalogLabel
        label: Old-site category link label (optional)
        type: string
      - name: image
        label: Solution photo
        type: image
      - name: body
        label: Solution details
        type: rich-text
        options:
          format: html
      - name: seoTitle
        label: Google title
        type: string
      - name: seoDescription
        label: Google description
        type: text
  - name: equipment
    label: Process equipment
    type: collection
    path: content/equipment
    format: json
    filename: '{primary}.json'
    view:
      primary: title
    fields:
      - name: title
        label: Equipment name
        type: string
        required: true
      - name: category
        type: string
      - name: summary
        type: text
      - name: catalogUrl
        label: Related products URL on tyceqt.com (optional)
        type: string
        description: Paste a verified category page URL from the established Tongyang English website.
      - name: catalogLabel
        label: Link label for old-site category (optional)
        type: string
        description: For example Storage Tanks or Heat Exchangers.
      - name: catalogUrl2
        label: Additional old-site category URL (optional)
        type: string
      - name: catalogLabel2
        label: Additional category link label (optional)
        type: string
      - name: image
        label: Equipment photo
        type: image
      - name: gallery
        label: Equipment Gallery (up to 6 photos)
        type: image
        options:
          multiple:
            max: 6
          unique: true
      - name: body
        label: Full equipment description
        type: rich-text
        options:
          format: html
      - name: seoTitle
        label: Google title
        type: string
      - name: seoDescription
        label: Google description
        type: text
  - name: products
    label: Products (under equipment categories)
    type: collection
    path: content/products
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      fields: [title, parentCategory, summary]
    fields:
      - name: title
        label: Product name
        type: string
        required: true
      - name: parentCategory
        label: Parent equipment category
        type: select
        required: true
        description: Choose one of the six main equipment categories. This determines where the product appears.
        options:
          placeholder: Select equipment category
          values:
            - name: reactors
              label: Chemical Reactors
            - name: evaporators
              label: Evaporators & Crystallizers
            - name: heat-exchangers
              label: Heat Exchangers
            - name: pressure-vessels
              label: Pressure Vessels
            - name: separators
              label: Process Separators
            - name: towers-and-columns
              label: Towers & Columns
      - name: category
        label: Additional product type (optional)
        type: string
      - name: summary
        label: Short product description
        type: text
        required: true
      - name: image
        label: Main product photo
        type: image
      - name: gallery
        label: Product photo gallery (up to 6)
        type: image
        options:
          multiple:
            max: 6
          unique: true
      - name: body
        label: Full product description (including table)
        type: rich-text
        options:
          format: html
      - name: seoTitle
        label: Google title (SEO)
        type: string
      - name: seoDescription
        label: Google description (SEO)
        type: text
  - name: projects
    label: Project references
    type: collection
    path: content/projects
    format: json
    filename: '{primary}.json'
    view:
      primary: title
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: published
        label: Publish on website (only after checking supply scope and permission)
        type: boolean
        default: false
      - name: category
        label: Project sector (e.g. Water Treatment & ZLD)
        type: string
      - name: summary
        label: Project overview for listing
        type: text
      - name: location
        label: Project location (optional)
        type: string
      - name: partner
        label: Project partner (only when disclosure is approved)
        type: string
      - name: image
        label: Approved project image (optional)
        type: image
      - name: gallery
        label: Project photo gallery (upload up to 12 images)
        type: image
        options:
          multiple:
            max: 12
          unique: true
      - name: body
        label: Project description and Tongyang's role
        type: rich-text
        options:
          format: html
      - name: seoTitle
        label: Google title
        type: string
      - name: seoDescription
        label: Google description
        type: text
  - name: certificates
    label: Certificates
    type: collection
    path: content/certificates
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      fields: [title, details, order]
    fields:
      - name: title
        label: Certificate name
        type: string
        required: true
      - name: details
        label: Certificate number or note (optional)
        type: string
      - name: image
        label: Certificate image
        type: image
        required: true
      - name: order
        label: Display order (1, 2, 3...)
        type: number
  - name: insights
    label: Technical articles
    type: collection
    path: content/insights
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
      - name: summary
        type: text
      - name: image
        label: Article cover image (optional)
        type: image
      - name: body
        label: Article content
        type: rich-text
        options:
          format: html
      - name: inlineImage
        label: Article image 1 (after first section)
        type: image
        description: Upload a real equipment photo or certificate. For the ASME article, choose the U certificate.
      - name: inlineImage2
        label: Article image 2 (after second section)
        type: image
        description: Upload another separate photo or certificate. For the ASME article, choose the U2 certificate.
      - name: seoTitle
        label: Google title
        type: string
      - name: seoDescription
        label: Google description
        type: text
